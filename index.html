
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">

  <title>Drilling Daily Monitoring</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #e2e8f0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      height: 76px;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #101e30, #081525);
      border-bottom: 1px solid #164b78;
      box-shadow: 0 3px 18px rgba(0, 153, 255, 0.15);
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 10px;
      filter: drop-shadow(0 0 7px rgba(0, 174, 255, 0.45));
    }

    .header-text {
      min-width: 0;
    }

    .header-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f1f7ff;
    }

    .header-subtitle {
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #38bdf8;
      font-weight: bold;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #4ade80;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    /* APP CONTENT */
    .app-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #07111f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #07111f;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .header {
        height: 68px;
        min-height: 68px;
        padding: 7px 11px;
        gap: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .header-title {
        font-size: 14px;
      }

      .header-subtitle {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .status {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <img
      src="./drill-squad.png"
      class="logo"
      alt="DRILL SQUAD Logo"
    >

    <div class="header-text">
      <h1 class="header-title">
        DRILLING MONITORING
      </h1>

      <div class="header-subtitle">
        DRILL SQUAD • DAILYCHECK & CLEANING FILTER
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      ONLINE
    </div>

  </header>

  <main class="app-container">

    <iframe
      src="https://script.google.com/macros/s/AKfycbzrO1dP07c_2UImWZXZ_t07bXkis26CfPjv1sViZGIgK6Y0Xe52tyIeOap_VPVGM9aI/exec"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => {
            console.error("Service Worker Error:", error);
          });
      });
    }
  </script>

</body>
</html>
