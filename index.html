
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">

  <title>Drilling Daily Monitoring</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #e2e8f0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
  padding: 16px;
  background: #101e30;
  border-bottom: 1px solid #1e3a5f;
  display: flex;
  align-items: center;
  gap: 12px;

  position: relative;
  z-index: 10;
  animation: hideHeader 0.5s ease forwards;
}

@keyframes hideHeader {
  0%, 70% {
    opacity: 1;
    height: 80px;
    padding-top: 16px;
    padding-bottom: 16px;
    overflow: hidden;
  }

  100% {
    opacity: 0;
    height: 0;
    padding-top: 0;
    padding-bottom: 0;
    border: 0;
    overflow: hidden;
  }
}

iframe {
  width: 100%;
  height: 100dvh;
  border: none;
  background: #07111f;
  display: block;
}

    /* APP CONTENT */
    .app-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #07111f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #07111f;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .header {
        height: 68px;
        min-height: 68px;
        padding: 7px 11px;
        gap: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .header-title {
        font-size: 14px;
      }

      .header-subtitle {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .status {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <img
      src="./drill-squad.png"
      class="logo"
      alt="DRILL SQUAD Logo"
    >

    <div class="header-text">
      <h1 class="header-title">
        DRILLING MONITORING
      </h1>

      <div class="header-subtitle">
        DRILL SQUAD • DAILYCHECK & CLEANING FILTER
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      ONLINE
    </div>

  </header>

  <main class="app-container">

    <iframe
      src="https://script.google.com/macros/s/AKfycbzrO1dP07c_2UImWZXZ_t07bXkis26CfPjv1sViZGIgK6Y0Xe52tyIeOap_VPVGM9aI/exec"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => {
            console.error("Service Worker Error:", error);
          });
      });
    }
  </script>

</body>
</html>
