
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">

  <title>Drilling Daily Monitoring</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07111f;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #101e30;
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    h3 {
      margin: 0;
      color: #22d3ee;
      font-size: 16px;
    }

    p {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 0;
    }

    iframe {
      width: 100%;
      height: calc(100dvh - 80px);
      border: none;
      background: #07111f;
    }
  </style>
</head>

<body>

<header>
  <img src="./icon-192.png" alt="Drill Squad">
  <div>
    <h3>DRILLING DAILY MONITORING</h3>
    <p>LIVE EOD MONITORING SYSTEM</p>
  </div>
</header>

<iframe
  src="https://script.google.com/macros/s/AKfycbzrO1dP07c_2UImWZXZ_t07bXkis26CfPjv1sViZGIgK6Y0Xe52tyIeOap_VPVGM9aI/exec"
  allow="clipboard-read; clipboard-write">
</iframe>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>

</body>
</html>
