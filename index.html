
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <!-- FAVICON BROWSER -->
<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icon-192-transparent.png"
>

<!-- APPLE HOME SCREEN -->
<link
  rel="apple-touch-icon"
  href="./icon-192-transparent.png"
>

  <title>DRILL SQUAD | Drilling Monitoring</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07111f;
      font-family: Arial, sans-serif;
    }

    /* =========================
       MAIN APP
    ========================= */

    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #07111f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #07111f;
    }

    /* =========================
       INTRO OVERLAY
    ========================= */

    
/* OVERLAY FULL SCREEN */
.intro-overlay {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  z-index: 999999;

  display: grid !important;
  place-items: center !important;

  padding: 20px;

  background: rgba(3, 10, 22, 0.78);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 1;
  visibility: visible;
}

/* POPUP TEPAT DI TENGAH */
.intro-card {
  position: relative !important;

  width: min(340px, 100%);
  margin: 0 !important;

  transform: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  padding: 34px 24px 28px;

  background: linear-gradient(
    145deg,
    rgba(20, 55, 82, 0.85),
    rgba(5, 17, 34, 0.92)
  );

  border: 1px solid rgba(34, 211, 238, 0.65);
  border-radius: 24px;

  box-shadow:
    0 0 20px rgba(34, 211, 238, 0.25),
    0 0 50px rgba(0, 140, 255, 0.2);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  animation: cardAppear 0.7s ease both;
}


    
/* =========================
   LOGO - 3D EMBOSS
========================= */

.logo-frame {
  width: 110px;
  height: 110px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  /* Hilangkan kotak logo */
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;

  overflow: visible;
}

.logo {
  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  display: block;
  background: transparent;

  /* Efek 3D emboss */
  filter:
    drop-shadow(0 2px 1px rgba(255, 255, 255, 0.35))
    drop-shadow(0 4px 1px rgba(0, 120, 160, 0.65))
    drop-shadow(0 7px 3px rgba(0, 0, 0, 0.65))
    drop-shadow(0 0 9px rgba(34, 211, 238, 0.65))
    drop-shadow(0 0 22px rgba(14, 165, 233, 0.35));

  animation: logo3DGlow 2.5s ease-in-out infinite alternate;
}

/* =========================
   LOGO 3D ANIMATION
========================= */

@keyframes logo3DGlow {
  from {
    filter:
      drop-shadow(0 2px 1px rgba(255,255,255,0.25))
      drop-shadow(0 4px 1px rgba(0,120,160,0.55))
      drop-shadow(0 7px 3px rgba(0,0,0,0.55))
      drop-shadow(0 0 8px rgba(34,211,238,0.45))
      drop-shadow(0 0 15px rgba(14,165,233,0.2));
  }

  to {
    filter:
      drop-shadow(0 2px 2px rgba(255,255,255,0.5))
      drop-shadow(0 5px 2px rgba(0,180,220,0.8))
      drop-shadow(0 8px 4px rgba(0,0,0,0.7))
      drop-shadow(0 0 14px rgba(34,211,238,0.85))
      drop-shadow(0 0 28px rgba(14,165,233,0.5));
  }
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 380px) {
  .intro-card {
    max-width: 310px;
    padding: 28px 18px 24px;
  }

  .logo-frame {
    width: 100px;
    height: 100px;
  }

  .logo {
    width: 100%;
    height: 100%;
  }

  .brand-name {
    font-size: 22px;
  }
}


    /* =========================
       TEXT
    ========================= */

    .brand-name {
      margin: 22px 0 0;

      color: #67e8f9;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;

      text-shadow:
        0 0 8px rgba(34, 211, 238, 0.8),
        0 0 22px rgba(34, 211, 238, 0.4);
    }

    .app-name {
      margin: 9px 0 0;

      color: #f1f5f9;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .app-description {
      margin: 8px 0 0;

      color: #94a3b8;
      font-size: 9px;
      letter-spacing: 1.2px;
      line-height: 1.6;
    }

    /* =========================
       ONLINE STATUS
    ========================= */

    .online-status {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 24px;
      padding: 7px 14px;

      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 30px;

      background: rgba(34, 197, 94, 0.08);

      color: #4ade80;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;

      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }

    /* =========================
       LOADING BAR
    ========================= */

    .loading-track {
      width: 80%;
      height: 3px;

      margin-top: 23px;

      overflow: hidden;
      border-radius: 10px;

      background: rgba(148, 163, 184, 0.15);
    }

    .loading-progress {
      width: 40%;
      height: 100%;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        #0ea5e9,
        #67e8f9,
        #3b82f6
      );

      box-shadow: 0 0 12px #22d3ee;

      animation: loadingMove 1.1s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 12px;

      color: #67e8f9;
      font-size: 8px;
      letter-spacing: 1.5px;
    }

    /* =========================
       EXIT ANIMATION
    ========================= */

    .intro-overlay.hide {
      animation: overlayExit 0.65s ease forwards;
      pointer-events: none;
    }

    .intro-overlay.hide .intro-card {
      animation: cardExit 0.65s ease forwards;
    }

    /* =========================
       KEYFRAMES
    ========================= */

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.88);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cardExit {
      to {
        opacity: 0;
        transform: translateY(-10px) scale(0.88);
      }
    }

    @keyframes overlayExit {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes logoGlow {
      from {
        box-shadow:
          0 0 10px rgba(34, 211, 238, 0.35),
          0 0 25px rgba(0, 140, 255, 0.15);
      }

      to {
        box-shadow:
          0 0 18px rgba(34, 211, 238, 0.7),
          0 0 40px rgba(0, 140, 255, 0.35);
      }
    }

    @keyframes loadingMove {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(250%);
      }
    }

    /* =========================
       SMALL SCREEN
    ========================= */

    @media (max-width: 380px) {
      .intro-card {
        max-width: 310px;
        padding: 28px 18px 24px;
      }

      .logo-frame {
        width: 90px;
        height: 90px;
      }

      .logo {
        width: 72px;
        height: 72px;
      }

      .brand-name {
        font-size: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    .push-button {
  position: fixed;
  top: 16px;
  right: 14px;
  z-index: 999998;

  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(34, 211, 238, 0.65);
  border-radius: 50%;

  background: rgba(7, 17, 31, 0.95);
  color: #67e8f9;

  font-size: 20px;
  cursor: pointer;

  box-shadow: 0 0 14px rgba(34, 211, 238, 0.3);
    }
  </style>
</head>

<body>
  
  <!-- DASHBOARD APPS SCRIPT -->
  <main class="app-container">

    <iframe
      src="https://script.google.com/macros/s/AKfycbwP0Ln2Hi4iEHVkc_jNhH4cjpzE6eYmiZvRvrvBZcwGLcxYDpsIDyMED96pPNP6kdIQ/exec"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>

  </main>

  <!-- NEON GLASS INTRO -->
  <div class="intro-overlay" id="introOverlay">

    <div class="intro-card">

      <div class="logo-frame">
        <img
          src="./drill-squad.png"
          class="logo"
          alt="DRILL SQUAD">
      </div>

      <h1 class="brand-name">
        DRILL SQUAD
      </h1>

      <div class="app-name">
        DRILLING MONITORING
      </div>

      <div class="app-description">
        DAILYCHECK & CLEANING FILTER<br>
        MONITORING SYSTEM
      </div>

      <div class="online-status">
        <span class="online-dot"></span>
        SYSTEM ONLINE
      </div>

      <div class="loading-track">
        <div class="loading-progress"></div>
      </div>

      <div class="loading-text">
        INITIALIZING APPLICATION...
      </div>

    </div>

  </div>
  
<!-- JAVASCRIPT -->
<script>

// =========================
// INTRO SCREEN
// =========================

(function () {

  function startIntro() {

    const intro = document.getElementById("introOverlay");

    if (!intro) return;

    // Hilangkan intro tanpa menunggu iframe selesai
    setTimeout(function () {

      intro.classList.add("hide");

      setTimeout(function () {
        intro.remove();
      }, 700);

    }, 2500);

  }

  // DOM siap, tidak perlu menunggu iframe
  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      startIntro,
      { once: true }
    );
  } else {
    startIntro();
  }

})();


// =========================
// SERVICE WORKER
// =========================

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./service-worker.js")
    .then(function (registration) {
      console.log(
        "Service Worker aktif:",
        registration.scope
      );
    })
    .catch(function (error) {
      console.error(
        "Service Worker Error:",
        error
      );
    });

}

  
// =========================
// DRILL SQUAD PUSH NOTIFICATION
// =========================

const PUSH_SERVER =
  "https://drill-squad-notif.imamalghozaly.workers.dev";

const VAPID_PUBLIC_KEY =
  "BPGbpWmcGCAat7uAjlwUXMSpZD2xGMFbRF4IWa3NO3_JCGSJ9BCi93p8Eu_TqgSKbbB1plx02WfsMqr7MqhigH8";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat(
    (4 - base64String.length % 4) % 4
  );

  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(char => char.charCodeAt(0))
  );
}

document.getElementById("enablePushBtn")
  .addEventListener("click", async function () {

    const button = this;

    try {
      if (!("serviceWorker" in navigator) ||
          !("PushManager" in window) ||
          !("Notification" in window)) {
        throw new Error(
          "Browser tidak mendukung Push Notification."
        );
      }

      button.disabled = true;
      button.textContent = "MEMPROSES...";

      const permission =
        await Notification.requestPermission();

      if (permission !== "granted") {
        throw new Error(
          "Izin notifikasi belum diberikan."
        );
      }

      const registration =
        await navigator.serviceWorker.ready;

      let subscription =
        await registration.pushManager.getSubscription();

      if (!subscription) {
        subscription =
          await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey:
              urlBase64ToUint8Array(BPGbpWmcGCAat7uAjlwUXMSpZD2xGMFbRF4IWa3NO3_JCGSJ9BCi93p8Eu_TqgSKbbB1plx02WfsMqr7MqhigH8)
          });
      }

      const response = await fetch(
        PUSH_SERVER + "/api/subscribe",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            subscription: subscription
          })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.message || "Gagal mendaftarkan perangkat."
        );
      }

      button.textContent = "✓ NOTIFIKASI AKTIF";
      button.style.color = "#4ade80";

      alert(
        "Perangkat berhasil didaftarkan untuk menerima notifikasi DRILL SQUAD."
      );

    } catch (error) {

      console.error("Push Error:", error);

      button.disabled = false;
      button.textContent = "🔔 COBA AKTIFKAN LAGI";

      alert(error.message);
    }
});
  

</script>
<button id="enablePushBtn" class="push-button" aria-label="Aktifkan notifikasi">
  🔔
</button>
  
</body>
</html>
