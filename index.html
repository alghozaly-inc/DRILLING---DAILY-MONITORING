
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">

  <title>Drilling Daily Monitoring</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #e2e8f0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      min-height: 80px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;

      background: #101e30;
      border-bottom: 1px solid #1e3a5f;

      position: relative;
      z-index: 10;
      flex-shrink: 0;

      opacity: 1;
      max-height: 100px;
      overflow: hidden;

      transition:
        opacity 0.25s ease,
        max-height 0.25s ease,
        min-height 0.25s ease,
        padding 0.25s ease,
        border 0.25s ease;
    }

    .header.header-hidden {
      opacity: 0;
      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border: 0;
    }

    .logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    .header-title {
      margin: 0;
      color: #22d3ee;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 9px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #4ade80;
      font-size: 10px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* =========================
       APP CONTENT
    ========================= */

    .app-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      background: #07111f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #07111f;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {
      .header {
        min-height: 68px;
        padding: 7px 11px;
        gap: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .header-title {
        font-size: 14px;
      }

      .header-subtitle {
        font-size: 8px;
        letter-spacing: 0.6px;
      }

      .status {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header" id="appHeader">

    <img
      src="./drill-squad.png"
      class="logo"
      alt="DRILL SQUAD Logo"
    >

    <div class="header-text">
      <h1 class="header-title">
        DRILLING MONITORING
      </h1>

      <div class="header-subtitle">
        DRILL SQUAD • DAILYCHECK & CLEANING FILTER
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      ONLINE
    </div>

  </header>

  <!-- APPS SCRIPT -->
  <main class="app-container">

    <iframe
      src="https://script.google.com/macros/s/AKfycbzrO1dP07c_2UImWZXZ_t07bXkis26CfPjv1sViZGIgK6Y0Xe52tyIeOap_VPVGM9aI/exec"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>

  </main>

  <script>
    // HEADER HILANG SETELAH 0,5 DETIK
    window.addEventListener("load", () => {
      setTimeout(() => {
        const header = document.getElementById("appHeader");

        if (header) {
          header.classList.add("header-hidden");
        }
      }, 1000);
    });

    // SERVICE WORKER
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => {
            console.error("Service Worker Error:", error);
          });
      });
    }
  </script>

</body>
</html>
